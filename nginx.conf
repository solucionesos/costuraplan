server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Desactivar access_log y activar sendfile/tcp_nopush para mínimo uso de CPU y RAM
    access_log off;
    error_log /dev/stderr crit;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 15;

    # Compresión ligera para transferir menos bytes
    gzip on;
    gzip_comp_level 2;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Never cache index.html, sw.js, or manifest so updates apply immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Redirect any legacy hashed JS/CSS requests from old cached index.html to deterministic bundle
    location ~ ^/assets/index-.*\.js$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        try_files /assets/app.js =404;
    }

    location ~ ^/assets/index-.*\.css$ {
        default_type text/css;
        add_header Cache-Control "no-cache";
        try_files /assets/app.css =404;
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback for routes
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
